# Vitre settings, loaded by install.sh with `dconf load /org/gnome/` (@HOME@ is replaced with your home folder).

[shell/extensions/Logo-menu]
custom-icon-path='@HOME@/.local/share/icons/hicolor/scalable/apps/vitre-glyph-symbolic.svg'
menu-button-icon-size=22
menu-button-terminal='org.gnome.Ptyxis'
show-activities-button=false
show-lockscreen=true
show-power-options=true
symbolic-icon=true
use-custom-icon=true

[shell/extensions/blur-my-shell/appfolder]
brightness=0.59999999999999998
sigma=30

[shell/extensions/blur-my-shell/dash-to-dock]
blur=true
brightness=0.59999999999999998
sigma=30
static-blur=true
style-dash-to-dock=0

[shell/extensions/blur-my-shell/overview]
blur=true

[shell/extensions/blur-my-shell/panel]
brightness=0.59999999999999998
corner-radius=0
sigma=30

[shell/extensions/blur-my-shell/popup]
blur=false

[shell/extensions/blur-my-shell/window-list]
brightness=0.59999999999999998
sigma=30

[shell/extensions/vitre-dock]
background-opacity=40
border-radius=50
click-effect='none'
dock-margin=8
dock-position='BOTTOM'
full-width=false
hide-mode='none'
hover-zoom=true
hover-zoom-factor=1.8
hover-zoom-radius=5.2999999999999998
hover-zoom-rise=0
hover-zoom-style='fluid'
icon-size=48
indicator-glow=false
indicator-size=5
indicator-style='dot'
minimize-effect='magic-lamp'
peek-effect=true
show-clock=false
show-desktop-button=true
show-documents=false
show-downloads=false
show-grid-button=false
show-home=false
show-mounts=false
show-music=false
show-pictures=false
show-trash=true
show-videos=false
stroke-opacity=25
stroke-width=1
show-apps-preview=true
show-notification-badges=true

[shell/extensions/just-perfection]
animation=5
clock-menu-position=1
clock-menu-position-offset=20
notification-banner-position=2
startup-status=0

[shell/extensions/liquid-glass]
blur-my-shell-popup-blur=false
enable-dock-glass=false
enable-menu-glass=true
enable-notification-glass=false
menu-blur-radius=24
menu-brightness=0.92000000000000004
menu-corner-radius=24.0
menu-enable-adaptive-text-color=false
menu-saturation=1.7
menu-spring-damping=29.0
menu-spring-stiffness=322.0
menu-tint-color='#1c1c1e'
menu-tint-strength=0.41999999999999998
notification-blur-radius=30
notification-corner-radius=24.0
notification-tint-color='#1c1c1e'
notification-tint-strength=0.80000000000000004
osd-blur-radius=24
osd-enable-adaptive-text-color=false
osd-tint-color='#1c1c1e'
osd-tint-strength=0.41999999999999998
panel-menu-blur-radius=24
panel-menu-brightness=0.92000000000000004
panel-menu-corner-radius=14.0
panel-menu-saturation=1.7
panel-menu-spring-damping=29.0
panel-menu-spring-stiffness=322.0
panel-menu-tint-color='#1c1c1e'
panel-menu-tint-strength=0.41999999999999998
quick-settings-blur-radius=24
quick-settings-brightness=0.90000000000000002
quick-settings-corner-radius=26.0
quick-settings-enable-adaptive-text-color=false
quick-settings-saturation=1.7
quick-settings-spring-damping=29.0
quick-settings-spring-stiffness=322.0
quick-settings-tint-color='#1c1c1e'
quick-settings-tint-strength=0.47999999999999998

[shell/extensions/rounded-window-corners-reborn]
border-width=-1
focused-shadow={'horizontalOffset': 0, 'verticalOffset': 21, 'blurOffset': 46, 'spreadRadius': -2, 'opacity': 65}
global-rounded-corner-settings={'padding': <{'left': <uint32 1>, 'right': <uint32 1>, 'top': <uint32 1>, 'bottom': <uint32 1>}>, 'keepRoundedCorners': <{'maximized': <false>, 'fullscreen': <false>}>, 'borderRadius': <uint32 17>, 'smoothing': <0>, 'borderColor': <[0.0, 0.0, 0.0, 0.115]>, 'enabled': <true>}
unfocused-shadow={'horizontalOffset': 0, 'verticalOffset': 21, 'blurOffset': 46, 'spreadRadius': -2, 'opacity': 44}

[shell/extensions/vitre-stage]
enabled=true

[shell/extensions/user-theme]
name='Vitre-Glass'

[shell/keybindings]
screenshot=['<Shift>Print', '<Shift><Super>3']
show-screenshot-ui=['Print', '<Shift><Super>s', '<Shift><Super>4', '<Shift><Super>5']

[desktop/interface]
color-scheme='prefer-dark'
accent-color='blue'
gtk-theme='Vitre-Glass'
icon-theme='Vitre-Icons'
cursor-theme='Vitre-Cursor'
font-name='Inter 11'
document-font-name='Inter 11'
monospace-font-name='JetBrains Mono 11'
font-antialiasing='grayscale'
font-hinting='none'
enable-animations=true
clock-show-weekday=true

[desktop/wm/keybindings]
switch-input-source=['XF86Keyboard']
switch-input-source-backward=['<Shift>XF86Keyboard']

[desktop/wm/preferences]
button-layout='close,minimize,maximize:'
titlebar-font='Inter Semi-Bold 11'

[desktop/background]
picture-options='zoom'
primary-color='#081226'
secondary-color='#081226'
color-shading-type='solid'
picture-uri='file://@HOME@/.local/share/backgrounds/vitre/vitre-drift-light.png'
picture-uri-dark='file://@HOME@/.local/share/backgrounds/vitre/vitre-drift-dark.png'

[mutter]
edge-tiling=false

